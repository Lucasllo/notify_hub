server:
  port: 8081

spring:
  application:
    name: notify-worker
  autoconfigure:
    # O worker renderiza strings do Mongo com JMustache; não usa view Mustache do MVC
    exclude: org.springframework.boot.autoconfigure.mustache.MustacheAutoConfiguration
  threads:
    virtual:
      # Listeners, @Async e Tomcat em virtual threads (WRK-05). O benchmark da Fase 4 só muda isto.
      enabled: ${VIRTUAL_THREADS:true}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/notify}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:notify}
    password: ${RABBITMQ_PASS:notify}
    # A Fase 2 republica nas filas de delay com confirm; já fica igual à API
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    cache:
      channel:
        # Publicações confirmadas concorrentes dos 30 consumidores (RESEARCH Armadilha 10)
        size: 50
    listener:
      simple:
        # Iniciado pelo runner depois dos índices e do seed (Armadilha 1)
        auto-startup: false
        acknowledge-mode: auto
        prefetch: 10
        # Exceção no listener = reject sem requeue = DLQ do canal, nunca loop (WRK-01)
        default-requeue-rejected: false
        retry:
          # Explícito: retry só pelas filas de delay (Fase 2), nunca em memória
          enabled: false

management:
  endpoints:
    web:
      exposure:
        # prometheus: métricas de entrega do D-15 (notify_delivery_*) e do Resilience4j (resilience4j_*).
        # Sem autenticação: só contagens e latências agregadas, sem PII; a porta 8081 fica na rede
        # local/compose (o Prometheus da Fase 4 coleta daqui)
        include: health,info,prometheus

notify:
  worker:
    # Um container por canal. 10 consumidores, acima das 8 CPUs de propósito (Armadilha 6)
    channels:
      email:
        concurrency: 10
      sms:
        concurrency: 10
      webhook:
        concurrency: 10
    # Lease gravado no claim; a recuperação de PROCESSING preso é da Fase 2 (WRK-03)
    lease: 5m
    # Espera máxima do confirm de retry/DLQ dentro do listener; estourou = falha da publicação
    confirm-timeout: 5s
  simulation:
    # Destinatários mágicos (falhas determinísticas da demo e dos ITs): e-mail <regra>@fail.test,
    # webhook http(s)://fail.test/<regra> e SMS +550000000<código>. Tabela em MagicRecipients.
    # fail-<N>-then-ok volta a falhar depois de um reprocessamento, que zera o retryCount.
    # Desligue fora da demo com NOTIFY_SIMULATION_MAGIC_RECIPIENTS=false.
    magic-recipients: ${NOTIFY_SIMULATION_MAGIC_RECIPIENTS:true}
    # Latência e failure-rate de cada canal aceitam ENV (ex.: NOTIFY_SIMULATION_EMAIL_FAILURERATE),
    # para o profile de benchmark da Fase 4 neutralizar as falhas (D-08)
    email:
      latency-min: 50ms
      latency-max: 200ms
      failure-rate: 0.0
    sms:
      latency-min: 50ms
      latency-max: 200ms
      failure-rate: 0.0
    webhook:
      latency-min: 50ms
      latency-max: 200ms
      failure-rate: 0.0

# Circuit breaker e bulkhead por canal (RES-01, RES-02), usados pelo ChannelGateway na ordem
# bulkhead → circuit breaker → adapter. Cada canal precisa da sua instância: o worker não sobe sem ela.
# Os placeholders de ENV deixam o profile de benchmark da Fase 4 afrouxar o bulkhead e neutralizar o CB
# sem mudar código (D-08); por canal, sobrescreva em instances.<canal>.
# Nenhum register-health-indicator: o CB aberto não pode derrubar o /actuator/health do worker.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${NOTIFY_CB_WINDOW_SIZE:20}
        minimum-number-of-calls: ${NOTIFY_CB_MIN_CALLS:10}
        failure-rate-threshold: ${NOTIFY_CB_FAILURE_RATE:50}
        # Tempo aberto ≤ 1º nível da escada (D-06), validado ao subir. Metade do nível (5s → 2500ms)
        # para o lote recusado voltar do delay depois do half-open, não durante
        wait-duration-in-open-state: ${NOTIFY_CB_OPEN_WAIT:2500ms}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Só falha transitória indica provedor doente; o resto (permanente, desconhecida, recusa de
        # bulkhead) é ignorado, porque sem ignore uma exceção não registrada contaria como sucesso
        record-exceptions:
          - dev.notifyhub.worker.failure.TransientDeliveryException
        ignore-exception-predicate: dev.notifyhub.worker.resilience.NonTransientFailurePredicate
    instances:
      email:
        base-config: default
      sms:
        base-config: default
      webhook:
        base-config: default
  bulkhead:
    configs:
      default:
        # Semáforo (nunca ThreadPoolBulkhead: o trabalho fica na virtual thread do listener).
        # 8 permissões para 10 consumidores de propósito, para a recusa aparecer sob carga (D-07)
        max-concurrent-calls: ${NOTIFY_BULKHEAD_MAX_CONCURRENT:8}
        # Sem espera: o excesso é recusado na hora e vira RETRYING
        max-wait-duration: 0ms
    instances:
      email:
        base-config: default
      sms:
        base-config: default
      webhook:
        base-config: default
