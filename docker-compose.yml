name: notify-hub

services:
  rabbitmq:
    image: rabbitmq:4.3.6-management
    # Hostname fixo: o RabbitMQ guarda os dados por nome de nó (rabbit@<hostname>).
    # Sem ele, um container recriado "perde" as filas do volume.
    hostname: notify-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: notify
      RABBITMQ_DEFAULT_PASS: notify
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  mongo:
    image: mongo:8.0.32
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    # Build multi-stage com o Maven dentro do container (sem JDK no host); contexto na raiz
    build:
      context: .
      dockerfile: notify-api/Dockerfile
    environment:
      # Profile demo: escada 1s/5s/25s. A chave admin vem do próprio profile (demo-admin-key),
      # por isso NOTIFY_ADMIN_API_KEY não é definida aqui
      SPRING_PROFILES_ACTIVE: demo
      MONGODB_URI: mongodb://mongo:27017/notify
      RABBITMQ_HOST: rabbitmq
      # Liga as probes do actuator (readiness), usadas pelo healthcheck abaixo
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      # Credenciais: notify/notify já é o padrão de RABBITMQ_USER/RABBITMQ_PASS (ver o worker)
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      # A readiness só fica UP depois dos ApplicationRunners (índices e declaração da topologia)
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 40s

  worker:
    # Build multi-stage com o Maven dentro do container (sem JDK no host); contexto na raiz
    build:
      context: .
      dockerfile: notify-worker/Dockerfile
    environment:
      # Profile demo: escada 1s/5s/25s, destinatários mágicos ligados e CB aberto por 500ms
      SPRING_PROFILES_ACTIVE: demo
      MONGODB_URI: mongodb://mongo:27017/notify
      RABBITMQ_HOST: rabbitmq
      # Liga as probes do actuator (readiness), usadas pelo healthcheck abaixo
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      # Credenciais: notify/notify já é o padrão de RABBITMQ_USER/RABBITMQ_PASS nos dois apps
      # e bate com o RABBITMQ_DEFAULT_USER/PASS do serviço rabbitmq, então não há ENV extra
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      # A readiness só fica UP depois dos ApplicationRunners: índices, seed dos templates
      # e start dos listeners. Antes disso o worker ainda não consome nada
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3.13.4
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    # Sem depends_on: alvo fora do ar só aparece como up=0 até subir

  grafana:
    # 12.4 de propósito: o Grafana 13 troca o formato padrão pelo schema v2 e o provisionamento
    # de dashboards clássicos por arquivo tem quebras relatadas
    image: grafana/grafana:12.4.12
    environment:
      # Acesso anônimo só como Viewer: o avaliador abre http://localhost:3000 sem login e cai direto
      # no dashboard Notify Hub, sem poder editar. admin/admin vale só nesta máquina (porta presa em
      # 127.0.0.1); é um risco aceito e registrado nos trade-offs
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/notify-hub.json
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Sem telemetria nem checagem de atualização (nada sai da máquina)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Datasource e provider provisionados; o JSON versionado é a fonte da verdade do dashboard
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  rabbitmq-data:
  mongo-data:
