# Profile da demo: escada de retry curta (1s, 5s, 25s). O worker usa os mesmos níveis (plano 01-05);
# se divergirem, surgem filas de delay extras no broker.
notify:
  topology:
    retry-levels: 1s,5s,25s
  admin:
    # Valor documentado só da demo, para o README e o compose da Fase 4 (NOTIFY_ADMIN_API_KEY
    # sobrescreve). Fora do profile demo a chave vem só da ENV e, vazia, /admin/** recusa tudo
    api-key: ${NOTIFY_ADMIN_API_KEY:demo-admin-key}
